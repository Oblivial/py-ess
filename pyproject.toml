[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ess"
version = "0.1.0"
description = "Dynamically load and index European Social Survey (ESS) data on demand."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "py-ess contributors" }]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
spss = ["pyreadstat>=1.2"]
dev = ["pytest>=7.0", "responses>=0.23", "pyreadstat>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyess = ["resources/*.json.gz"]

# The raw codebook.html (~10MB) and rounds.json are only needed to *build*
# the compressed codebook.json.gz snapshot (see
# scripts/build_codebook_json.py) - they're not needed at runtime and are
# excluded from built sdists/wheels to keep the distributed package small.
# They stay in the git repo as source input for that build step.
[tool.setuptools.exclude-package-data]
pyess = ["resources/codebook.html", "resources/rounds.json"]


